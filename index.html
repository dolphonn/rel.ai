<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rel.ai — Kanban</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Cpath d='M18 34l10 10 18-22' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("rel.ai.theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">rel<span class="brand-dot">.</span>ai</div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" class="search-input" type="text" placeholder="Search cards…" aria-label="Search cards by title or description" autocomplete="off" spellcheck="false" />
      </div>

      <button id="filter-labels-btn" class="filter-btn" type="button" aria-haspopup="true">
        Labels <span class="badge" id="filter-labels-count" hidden></span>
        <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button id="filter-assignees-btn" class="filter-btn" type="button" aria-haspopup="true">
        Assignees <span class="badge" id="filter-assignees-count" hidden></span>
        <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button id="clear-filters-btn" class="link-btn" type="button" hidden>Clear filters</button>
    </div>

    <div class="topbar-right">
      <button id="archive-btn" class="icon-btn" type="button" title="Open archive" aria-label="Open archive">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <span class="badge badge-dot" id="archive-count" hidden></span>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle dark or light mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main id="board-wrap">
    <div id="board" class="board" aria-label="Kanban board"></div>
    <div id="no-results" hidden>
      <span>No cards match your filters</span>
      <button class="link-btn" id="no-results-clear" type="button">Clear filters</button>
    </div>
  </main>

  <!-- Archive slide-over -->
  <div id="archive-backdrop" class="scrim" hidden></div>
  <aside id="archive-panel" class="archive-panel" aria-label="Archive" aria-hidden="true">
    <div class="ap-head">
      <h2 class="ap-title">Archive</h2>
      <button class="icon-btn" id="archive-close" type="button" title="Close archive" aria-label="Close archive">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="ap-body" id="archive-body"></div>
  </aside>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
